<form method="POST" action="/">
    <p>就業規則について質問を入力してください。</p>
    <textarea name="q"></textarea>
    <input type="submit" value="送信">
</form>
<table>
    <tr><td>質問</td><td></td></tr>
    <tr><td colspan="2">{{ q | safe }}</td></tr>
    <tr><td>答え</td><td></td></tr>
    <tr><td colspan="2">{{ ans | safe }}</td></tr>
</table>
